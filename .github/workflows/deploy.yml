name: Deploy to WordPress.org

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish Plugin to WordPress.org
        uses: stablepress/action-wordpress-plugin-deploy@v2
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: nsk-quick-stock-manager
          WP_USERNAME: nskdev
