name: Deploy to WordPress.org

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish to WordPress SVN
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: nsk-quick-stock-manager
          WP_USERNAME: nskdev
        run: |
          sudo apt-get update && sudo apt-get install -y subversion
          
          echo "Checking out WordPress SVN repository..."
          svn co --non-interactive https://plugins.svn.wordpress.org/nsk-quick-stock-manager svn-repo
          
          echo "Copying plugin files to trunk (excluding svn-repo folder)..."
          rsync -av --exclude='.git' --exclude='.github' --exclude='svn-repo' ./ svn-repo/trunk/
          
          cd svn-repo
          
          echo "Adding new files to SVN..."
          svn status | grep '^\?' | awk '{print $2}' | xargs -r svn add --non-interactive
          
          echo "Committing to WordPress.org..."
          svn commit --non-interactive --username "$WP_USERNAME" --password "$SVN_PASSWORD" -m "Automated deployment from GitHub Actions"
          
          echo "Deployment completed successfully!"
